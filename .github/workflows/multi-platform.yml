name: Build Geode Mod
on:
  workflow_dispatch:
  push:
    branches:
      - "**"
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest
        - name: macOS
          os: macos-latest
        - name: Android32
          os: ubuntu-latest
          target: Android32
        - name: Android64
          os: ubuntu-latest
          target: Android64
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    steps:
      - uses: actions/checkout@v4

      # Pre-place sccache at the EXACT path ccache-action checks
      # If the file is already there, it skips its broken download entirely
      - name: Pre-install sccache (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y sccache
          sudo cp $(which sccache) /usr/local/bin/sccache
          sudo chmod +x /usr/local/bin/sccache
          echo "sccache ready at $(which sccache)"
          sccache --version

      - name: Pre-install sccache (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sccache
          sudo cp $(which sccache) /usr/local/bin/sccache
          sudo chmod +x /usr/local/bin/sccache
          sccache --version

      - name: Pre-install sccache (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install sccache -y
          sccache --version

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}