name: Build Geode Mod
on:
  workflow_dispatch:
  push:
    branches:
      - "**"
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
        - name: Windows
          os: windows-latest
        - name: macOS
          os: macos-latest
        - name: Android32
          os: ubuntu-latest
          target: Android32
        - name: Android64
          os: ubuntu-latest
          target: Android64
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    env:
      # Tell the action's internal steps that ninja is already on PATH
      NINJA_EXE: ninja
    steps:
      - uses: actions/checkout@v4

      - name: Pre-install ninja + sccache (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ninja -y
          choco install sccache -y
          # Put choco bin on PATH for subsequent steps
          echo "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          ninja --version
          sccache --version

      - name: Pre-install ninja + sccache (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja sccache
          sudo cp $(which sccache) /usr/local/bin/sccache
          ninja --version
          sccache --version

      - name: Pre-install ninja + sccache (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ninja-build sccache
          sudo cp $(which sccache) /usr/local/bin/sccache
          ninja --version
          sccache --version

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ['build']
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}